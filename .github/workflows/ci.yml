name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt in to anything more.
permissions:
  contents: read

env:
  NODE_ENV: test
  CI: true

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No package-lock.json found; falling back to npm install. Commit the lockfile."
            npm install --no-audit --no-fund
          fi

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build
        run: npm run build --workspace=Frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          if-no-files-found: error
          retention-days: 7

  # Gate: every job above must pass before a PR is mergeable.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [validate, build-frontend]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "validate: ${{ needs.validate.result }}"
          echo "build-frontend: ${{ needs.build-frontend.result }}"
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.build-frontend.result }}" != "success" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
