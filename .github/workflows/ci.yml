name: CI

# Validation for every PR and push: backend, backend-on-Postgres, frontend,
# models, and the infrastructure definitions themselves. Images are built in
# images.yml; security scanning lives in security.yml / codeql.yml.
#
# Actions are pinned by full commit SHA (version in the trailing comment);
# Dependabot (github-actions ecosystem) keeps them current.

on:
  push:
    branches: [main, develop, "wave*/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22.x"

jobs:
  backend:
    name: Backend (typecheck, lint, smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (lifecycle scripts disabled by .npmrc)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --workspace=Backend
      - name: Lint
        run: npm run lint --workspace=Backend
      - name: Smoke (in-memory store)
        run: npm run smoke --workspace=Backend

  backend-postgres:
    name: Backend smoke on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_USER: devhq
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: devhq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhq -d devhq"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://devhq:ci-only-not-a-secret@127.0.0.1:5432/devhq
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # B-DATA adds `migrate` and `smoke:pg` to Backend/package.json. Until that
      # lands the job says so explicitly instead of passing silently.
      - name: Detect Postgres scripts
        id: scripts
        run: |
          has() { node -e "process.exit(require('./Backend/package.json').scripts?.['$1'] ? 0 : 1)"; }
          if has migrate && has smoke:pg; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"
               echo "::warning title=backend-postgres::Backend has no migrate/smoke:pg scripts yet (B-DATA); Postgres smoke skipped."
          fi
      - name: Migrate (twice, must be idempotent)
        if: steps.scripts.outputs.ready == 'true'
        run: |
          npm run migrate --workspace=Backend
          npm run migrate --workspace=Backend
      - name: Smoke against Postgres
        if: steps.scripts.outputs.ready == 'true'
        run: npm run smoke:pg --workspace=Backend

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --workspace=Frontend
      - name: Lint
        run: npm run lint --workspace=Frontend
      - name: Build
        run: npm run build --workspace=Frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: Frontend/dist
          if-no-files-found: error
          retention-days: 7

  models:
    name: Models (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python service (ML lane) ships Models/pyproject.toml. Until it
      # lands the job warns instead of passing silently.
      - name: Detect Python project
        id: py
        run: |
          if [ -f Models/pyproject.toml ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "ready=false" >> "$GITHUB_OUTPUT"
               echo "::warning title=models::Models/pyproject.toml not found (ML lane); Python checks skipped."
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.py.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Models/pyproject.toml
            Models/requirements*.txt
      - name: Install
        if: steps.py.outputs.ready == 'true'
        working-directory: Models
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            [ -f requirements.txt ] && pip install -r requirements.txt
            pip install -r requirements-dev.txt
          else
            pip install -e ".[dev]"
          fi
      - name: Ruff
        if: steps.py.outputs.ready == 'true'
        working-directory: Models
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        if: steps.py.outputs.ready == 'true'
        working-directory: Models
        run: mypy .
      - name: Pytest
        if: steps.py.outputs.ready == 'true'
        working-directory: Models
        run: pytest -q

  infra:
    name: Infra (compose, hadolint, actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose files validate
        run: |
          # Placeholder secret files so `config` can resolve every reference.
          mkdir -p infra/secrets
          sed -n 's/^  \([a-z_]*\): *{ file: .*/\1/p' docker-compose.yml \
            | while read -r s; do : > "infra/secrets/$s"; done
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Hadolint
        run: |
          for f in Backend/Dockerfile Frontend/Dockerfile infra/edge/Dockerfile $(ls Models/Dockerfile 2>/dev/null); do
            echo "::group::$f"
            docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" \
              hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
              hadolint - < "$f"
            echo "::endgroup::"
          done
      - name: Actionlint (includes shellcheck of run steps)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - name: Shellcheck infra scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            -x infra/scripts/*.sh infra/docker/*.sh infra/postgres/initdb/*.sh

  audit:
    name: Dependency audit gate (npm, high+)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Lockfile-only: nothing is installed or executed. Runtime deps of every
      # workspace must have no known high/critical advisory.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high --workspaces --include-workspace-root
      - name: npm audit signatures (registry provenance)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures

  ci-success:
    name: CI success
    runs-on: ubuntu-24.04
    needs: [backend, backend-postgres, frontend, models, infra, audit]
    if: always()
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job did not succeed"; exit 1; }; done
