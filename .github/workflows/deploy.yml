name: Deploy

# Manual, environment-protected rollout to a Docker Compose host over SSH.
#
#   Actions -> Deploy -> Run workflow -> ref, environment
#
# Branch model: production deploys only release tags (vX.Y.Z, cut from main);
# staging deploys only commits on develop. Enforced below before any SSH.
#
# Required per GitHub Environment (Settings -> Environments; add required
# reviewers / branch rules there, that is the approval gate):
#   secrets.DEPLOY_SSH_KEY       private key of the host's `deploy` user (ed25519)
#   secrets.DEPLOY_KNOWN_HOSTS   output of `ssh-keyscan -t ed25519 <host>` (verified out of band)
#   vars.DEPLOY_HOST             host name or IP
#   vars.DEPLOY_USER             default: deploy
#   vars.DEPLOY_PATH             default: /opt/devhq
#
# Flow: resolve ref -> verify cosign signatures of every image for that commit
# -> ssh host `infra/scripts/deploy.sh <sha>` which backs up the DB, pulls,
# recreates, health-gates through the edge, and rolls back automatically to the
# previous commit + image tag if the gate fails.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "production: release tag vX.Y.Z | staging: commit SHA or branch on develop"
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
        default: staging

# One deploy per environment at a time; never cancel a rollout midway.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.ref }} to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
      packages: read   # cosign verify against private GHCR packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce branch model
        env:
          REF: ${{ inputs.ref }}
          TARGET: ${{ inputs.environment }}
        run: |
          if [ "$TARGET" = production ]; then
            if ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$REF" >/dev/null; then
              echo "::error::production deploys only release tags vX.Y.Z (got '$REF')"; exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main \
              || { echo "::error::tag $REF is not on main"; exit 1; }
          else
            git merge-base --is-ancestor HEAD origin/develop \
              || { echo "::error::staging deploys only commits on develop"; exit 1; }
          fi

      - name: Resolve commit
        id: rev
        run: |
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not resolve ref"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify image signatures
        env:
          SHA: ${{ steps.rev.outputs.sha }}
          PREFIX: ${{ steps.rev.outputs.prefix }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | cosign login ghcr.io -u "$ACTOR" --password-stdin
          images="backend frontend edge"
          [ -f Models/Dockerfile ] && images="$images models"
          for img in $images; do
            cosign verify "$PREFIX-$img:sha-$SHA" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "verified $img"
          done

      - name: Configure SSH (pinned host key, no TOFU)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] || { echo "::error::DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS not set for this environment"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Roll out (health-gated, automatic rollback)
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/devhq' }}
          SHA: ${{ steps.rev.outputs.sha }}
        run: |
          [ -n "$HOST" ] || { echo "::error::vars.DEPLOY_HOST not set"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::bad DEPLOY_PATH"; exit 1; }
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 \
              "$DEPLOY_USER@$HOST" "cd '$DEPLOY_PATH' && infra/scripts/deploy.sh '$SHA'"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
