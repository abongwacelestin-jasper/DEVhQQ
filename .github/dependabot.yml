version: 2
updates:
  # npm: a single workspace lockfile at the root covers Backend, Frontend and
  # Models. (Per-package entries had no lockfile to update.)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        patterns: ["@types/*", "eslint*", "@eslint/*", "typescript*", "@typescript-eslint/*", "prettier*", "vite*", "@vitejs/*"]
      react:
        patterns: ["react*", "@emotion/*", "framer-motion*"]

  # GitHub Actions are pinned by commit SHA; Dependabot bumps SHA + comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Base images pinned by digest in Dockerfiles and compose.
  - package-ecosystem: docker
    directories: ["/Backend", "/Frontend", "/infra/edge", "/Models"]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: build
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    commit-message:
      prefix: build

  # Python ML service (ML lane: Models/pyproject.toml).
  - package-ecosystem: pip
    directory: "/Models"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ml]
    commit-message:
      prefix: chore
      include: scope
