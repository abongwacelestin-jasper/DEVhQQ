# Security headers for the SPA shell and static assets.
#
# Included from every `location` that serves content, because nginx drops
# server-level add_header directives as soon as a location adds its own.
#
# Keep in step with Backend/security/headers.ts (owned by SEC). Differences are
# deliberate and limited to what the SPA bundle needs that the API does not:
#   - fonts.googleapis.com / fonts.gstatic.com: Frontend/src/index.css imports
#     Inter + JetBrains Mono from Google Fonts.
#   - cdn.jsdelivr.net: @monaco-editor/react loads the Monaco AMD bundle, its
#     CSS and the codicon font from jsDelivr by default.
#   - worker-src blob:: utils/codeRunner.ts and Monaco run code in blob: workers.
#   - no nonce: the Vite build emits only external module scripts, so
#     'self' is sufficient and nothing inline is allowed.
# HSTS is set once, at the edge (infra/edge/Caddyfile), for every response.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://avatars.githubusercontent.com https://cdn.magicpatterns.com; connect-src 'self' https://api.github.com; worker-src 'self' blob:; frame-src https://js.stripe.com; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
