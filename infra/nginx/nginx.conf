# nginx for the DevHQ SPA (Frontend/dist), running unprivileged on a
# read-only root filesystem. All writable paths point at /tmp (a tmpfs).
#
# Sits behind the edge (Caddy), which terminates TLS, sets HSTS and routes
# /api/* to the backend. This server only ever sees non-API paths.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Log the real client: only the edge talks to us, over a private network.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr",'
        '"method":"$request_method","path":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"ms":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Compression: hashed assets are pre-compressed at build time (*.gz served
    # by gzip_static); anything else is compressed on the fly. Brotli is not
    # compiled into the stock nginx-unprivileged image; the edge adds zstd.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/manifest+json
               font/ttf application/wasm;

    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Dotfiles (.git, .env, ...) are never served, even if one slips in.
        location ~ /\. {
            return 404;
        }

        # API paths belong to the backend. If one reaches this server the edge
        # is misrouted; answer 404 instead of returning the SPA shell.
        location ^~ /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"API is served by the backend"}}';
        }

        # Content-hashed build output: cache forever.
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The SPA shell must always be revalidated so a deploy is picked up.
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Un-hashed files copied from Frontend/public (images, icons).
        location ~* \.(?:png|jpe?g|gif|webp|avif|ico|svg|woff2?)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=86400" always;
            try_files $uri =404;
        }

        # Client-side routes fall back to the shell.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
